<style>
/* Layout: thanh trên cùng · trái là mục lục phân cấp của lecture đang mở · giữa là bài đọc · phải là bảng ghi chú */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --ink: #171A26;
  --muted: #5A6075;
  --line: #DADDE7;
  --accent: #2E48D4;
  --accent-soft: #E7EBFD;
  --hl: #FFE36A;
  --key: #2E48D4;   --key-bg: #EEF1FE;
  --life: #0F7B5F;  --life-bg: #E7F6F0;
  --warn: #B4400F;  --warn-bg: #FDF0E8;
  --num: #6B3FB8;   --num-bg: #F2ECFB;
  --code-bg: #EEF0F6;
  --an-yellow: #FFE58F; --an-green: #BFEBD5; --an-blue: #CCD7FF; --an-pink: #F9CBE0;
  --an-yellow-s: #C99A00; --an-green-s: #1F9D6E; --an-blue-s: #4762E6; --an-pink-s: #D2468A;
  --shadow: 0 1px 2px rgba(23,26,38,.06), 0 6px 20px rgba(23,26,38,.06);
  --shadow-lg: 0 2px 6px rgba(23,26,38,.08), 0 16px 40px rgba(23,26,38,.14);
  --top: 56px;
  --f-display: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1118; --surface: #171A24; --ink: #E6E8F0; --muted: #99A0B5; --line: #2A2F3E;
    --accent: #8FA2FF; --accent-soft: #1E2547; --hl: rgba(255,214,64,.30);
    --key: #9BACFF; --key-bg: #1A2040;
    --life: #5FD3AE; --life-bg: #11281F;
    --warn: #FFA472; --warn-bg: #2E1C12;
    --num: #C3A3FF; --num-bg: #241A38;
    --code-bg: #1E2230;
    --an-yellow: rgba(255,214,64,.34); --an-green: rgba(95,211,174,.30); --an-blue: rgba(143,162,255,.34); --an-pink: rgba(255,130,185,.32);
    --an-yellow-s: #FFD640; --an-green-s: #5FD3AE; --an-blue-s: #8FA2FF; --an-pink-s: #FF8AC0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1118; --surface: #171A24; --ink: #E6E8F0; --muted: #99A0B5; --line: #2A2F3E;
  --accent: #8FA2FF; --accent-soft: #1E2547; --hl: rgba(255,214,64,.30);
  --key: #9BACFF; --key-bg: #1A2040;
  --life: #5FD3AE; --life-bg: #11281F;
  --warn: #FFA472; --warn-bg: #2E1C12;
  --num: #C3A3FF; --num-bg: #241A38;
  --code-bg: #1E2230;
  --an-yellow: rgba(255,214,64,.34); --an-green: rgba(95,211,174,.30); --an-blue: rgba(143,162,255,.34); --an-pink: rgba(255,130,185,.32);
  --an-yellow-s: #FFD640; --an-green-s: #5FD3AE; --an-blue-s: #8FA2FF; --an-pink-s: #FF8AC0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 18px; line-height: 1.65;
}
a { color: var(--accent); }
button { font-family: var(--f-display); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Thanh trên cùng ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: var(--top);
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); font-family: var(--f-display);
}
.brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); text-decoration: none; margin-right: 6px; }
.brand span { color: var(--accent); }
.tb-gap { flex: 1; }
.icon-btn {
  position: relative; height: 36px; min-width: 36px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 13px var(--f-display); cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.icon-btn .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--surface); font-size: 11px; display: inline-grid; place-items: center; }
.icon-btn .badge:empty { display: none; }

.lec-pick { position: relative; min-width: 0; flex: 0 1 auto; }
.lec-pick > button {
  display: flex; align-items: center; gap: 8px; max-width: min(520px, 100%); min-width: 0; height: 36px; padding: 0 10px 0 12px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: 600 14px var(--f-display);
}
.lec-pick > button:hover { border-color: var(--accent); }
.lec-pick > button .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lec-pick > button .n { color: var(--accent); font-weight: 800; white-space: nowrap; }
.lec-menu {
  position: absolute; top: calc(100% + 6px); left: 0; width: min(440px, calc(100vw - 32px)); z-index: 50;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 8px;
}
.lec-menu[hidden] { display: none; }
.lec-menu a { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 10px; border-radius: 10px; color: var(--ink); text-decoration: none; }
.lec-menu a:hover { background: var(--accent-soft); }
.lec-menu a[aria-current="page"] { background: var(--accent-soft); }
.lec-menu a[aria-current="page"] .lm-num { color: var(--accent); }
.lm-num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; color: var(--muted); }
.lm-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
.lm-meta { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.lm-foot { margin: 6px 4px 2px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- Bố cục 3 cột ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.app.side-on { grid-template-columns: 264px minmax(0, 1fr); }
.app.notes-on { grid-template-columns: minmax(0, 1fr) 340px; }
.app.side-on.notes-on { grid-template-columns: 264px minmax(0, 1fr) 340px; }
.side, .notes { display: none !important; }
.app.side-on .side { display: block !important; }
.app.notes-on .notes { display: flex !important; }
.side, .notes {
  position: sticky; top: var(--top); align-self: start;
  height: calc(100vh - var(--top)); height: calc(100dvh - var(--top));
  overflow-y: auto; font-family: var(--f-display);
}
.side { border-right: 1px solid var(--line); padding: 22px 14px 48px 18px; }
.side-x { position: absolute; top: -4px; right: 0; height: 30px; min-width: 30px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
.notes { border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }

/* ---------- Mục lục phân cấp (trái) ---------- */
.side-head { position: relative; padding: 0 34px 18px 6px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.side-head .k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.side-head .tt { font-size: 16px; font-weight: 800; line-height: 1.3; margin: 4px 0 12px; letter-spacing: -.01em; }
.side-prog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.side-prog .bar { flex: 1; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
.side-prog .bar i { display: block; height: 100%; width: 0; background: var(--life); transition: width .3s; }
.toc-tree, .toc-tree ol { list-style: none; margin: 0; padding: 0; }
.toc-tree a {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 7px;
  font-size: 13.5px; line-height: 1.35; color: var(--muted); text-decoration: none;
}
.toc-tree a:hover { color: var(--ink); background: var(--accent-soft); }
.toc-tree a .tick { width: 12px; flex: none; color: var(--life); font-weight: 800; font-size: 12px; }
.toc-tree li.active > a { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.toc-part { margin-top: 10px; }
.toc-part > button {
  all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 7px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
}
.toc-part > button:hover { background: var(--accent-soft); }
.toc-part > button:focus-visible { outline: 2px solid var(--accent); }
.toc-part > button svg { width: 14px; height: 14px; transition: transform .15s; }
.toc-part > button[aria-expanded="false"] svg { transform: rotate(-90deg); }
.toc-part > button .cnt { margin-left: auto; font-weight: 600; letter-spacing: 0; color: var(--muted); font-size: 11px; }
.toc-part > ol { margin-left: 13px; padding-left: 6px; border-left: 1px solid var(--line); }
.toc-part > button[aria-expanded="false"] + ol { display: none; }
.toc-sub { display: none; margin: 2px 0 4px 20px !important; }
.toc-tree li.active > .toc-sub { display: block; }
.toc-sub a { font-size: 12.5px; padding: 3px 8px; }
.toc-sub li.on > a { color: var(--ink); }

/* ---------- Bài đọc (giữa) ---------- */
main { min-width: 0; padding-block: 40px 120px; padding-inline: 40px; }
.reader { max-width: 760px; margin: 0 auto; }
.lec-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
.eyebrow { font: 600 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.lec-head h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 4.6vw, 46px);
  line-height: 1.08; letter-spacing: -.025em; margin: 0; text-wrap: balance;
}
.lec-head .sub { font-size: 19px; color: var(--muted); margin: 0; }
.progress { display: flex; align-items: center; gap: 12px; font: 500 13px var(--f-display); color: var(--muted); }
.progress .bar { flex: 1; max-width: 240px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.mtoc { display: none; }

.reader h2 {
  font-family: var(--f-display); font-size: 27px; line-height: 1.2; letter-spacing: -.015em;
  margin: 64px 0 14px; text-wrap: balance;
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
}
.reader h2, .reader h3, .reader .part { scroll-margin-top: calc(var(--top) + 18px); }
.reader h2 .slide-range { font: 500 13px var(--f-mono); color: var(--muted); letter-spacing: 0; }
.reader h3 { font-family: var(--f-display); font-size: 19px; margin: 32px 0 8px; }
.part {
  margin: 80px 0 0; padding-top: 22px; border-top: 3px solid var(--ink);
  font: 800 14px var(--f-display); letter-spacing: .14em; text-transform: uppercase;
}
.part small { display: block; font: 400 17px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 6px; }
.reader p, .reader li { text-align: justify; text-justify: inter-word; hyphens: manual; overflow-wrap: break-word; }
.reader .widget p, .reader .tbl p, .reader .lec-head p, .reader .quiz summary { text-align: left; }
.reader ul, .reader ol { padding-left: 1.3em; }
.reader li + li { margin-top: 6px; }
mark { background: var(--hl); color: inherit; padding: 0 .15em; border-radius: 3px; }
code { font-family: var(--f-mono); font-size: .84em; background: var(--code-bg); padding: .1em .35em; border-radius: 5px; }
.reader pre { overflow-x: auto; background: var(--code-bg); padding: 12px 14px; border-radius: 10px; margin: 16px 0; max-width: 100%; }
.reader pre code { background: none; padding: 0; font-size: 14px; }
dfn { font-style: normal; font-weight: 600; border-bottom: 1.5px dotted var(--accent); }
.en { font-style: italic; color: var(--muted); }

.mathbox { overflow-x: auto; padding: 4px 0; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

/* Callout */
.note { margin: 22px 0; padding: 14px 18px 14px 18px; border-radius: 12px; border: 1px solid transparent; }
.note > :first-child { margin-top: 0; } .note > :last-child { margin-bottom: 0; }
.note::before { display: block; font: 700 12px var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
.note.key  { background: var(--key-bg);  border-color: color-mix(in srgb, var(--key) 25%, transparent); }
.note.key::before  { content: "Key idea"; color: var(--key); }
.note.life { background: var(--life-bg); border-color: color-mix(in srgb, var(--life) 25%, transparent); }
.note.life::before { content: "Everyday analogy"; color: var(--life); }
.note.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.note.warn::before { content: "Watch out"; color: var(--warn); }
.note.num  { background: var(--num-bg);  border-color: color-mix(in srgb, var(--num) 25%, transparent); }
.note.num::before  { content: "Try the numbers"; color: var(--num); }

/* Ảnh slide */
.slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 18px 0 22px; }
.slides.one { grid-template-columns: minmax(0, 1fr); }
.sl {
  all: unset; cursor: zoom-in; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
}
.sl:hover { border-color: var(--accent); }
.sl:focus-visible { outline: 2px solid var(--accent); }
.sl img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 6px; background: #fff; }
.sl span { font: 600 12px var(--f-display); color: var(--muted); padding: 0 4px 2px; }

/* Bảng */
.tbl { overflow-x: auto; margin: 18px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 600 13px var(--f-display); color: var(--muted); background: var(--code-bg); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.hi { font-weight: 600; color: var(--accent); }

/* Widget */
.widget { margin: 22px 0; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); font-family: var(--f-display); font-size: 15px; }
.widget h4 { margin: 0 0 12px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.widget label { font-weight: 600; }
.widget input[type="range"] { width: 100%; accent-color: var(--accent); }
.widget .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.widget .chip { padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Tự kiểm tra */
.quiz { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
.quiz details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.quiz summary { cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.quiz details[open] summary { margin-bottom: 8px; color: var(--accent); }
.quiz details > div > :last-child { margin-bottom: 0; }

/* Đánh dấu đã hiểu */
.done-btn {
  margin-left: auto; font: 600 12px var(--f-display); padding: 5px 11px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; user-select: none;
}
.done-btn[aria-pressed="true"] { background: var(--life-bg); border-color: var(--life); color: var(--life); }

/* Chuyển lecture ở cuối bài */
.lec-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line); font-family: var(--f-display); }
.lec-nav a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); }
.lec-nav a:hover { border-color: var(--accent); }
.lec-nav a.next { text-align: right; grid-column: 2; }
.lec-nav small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-bottom: 4px; }
.lec-nav b { font-size: 15px; line-height: 1.35; }

/* ---------- Đánh dấu & ghi chú trong bài ---------- */
.anno { border-radius: 2px; cursor: pointer; transition: box-shadow .2s, background-color .2s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.anno.c-yellow { background: var(--an-yellow); } .anno.c-green { background: var(--an-green); }
.anno.c-blue { background: var(--an-blue); }     .anno.c-pink { background: var(--an-pink); }
.anno.has-note.c-yellow { box-shadow: inset 0 -2px 0 var(--an-yellow-s); } .anno.has-note.c-green { box-shadow: inset 0 -2px 0 var(--an-green-s); }
.anno.has-note.c-blue { box-shadow: inset 0 -2px 0 var(--an-blue-s); }     .anno.has-note.c-pink { box-shadow: inset 0 -2px 0 var(--an-pink-s); }
.anno.lit { box-shadow: 0 0 0 2px var(--accent) !important; }
.anno.flash { animation: annoFlash 1.6s ease; }
@keyframes annoFlash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

.selpop {
  position: fixed; z-index: 60; display: flex; align-items: center; gap: 6px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); font-family: var(--f-display);
}
.selpop[hidden] { display: none; }
.selpop .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw:hover, .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.sw.c-yellow { background: var(--an-yellow-s); } .sw.c-green { background: var(--an-green-s); }
.sw.c-blue { background: var(--an-blue-s); }     .sw.c-pink { background: var(--an-pink-s); }
.selpop .add { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--accent); color: var(--surface); font: 700 13px var(--f-display); cursor: pointer; }
.selpop.touch { left: 50% !important; transform: translateX(-50%); top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Bảng ghi chú (phải) ---------- */
.np-head { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
.np-title { display: flex; align-items: center; gap: 8px; }
.np-title b { font-size: 15px; font-weight: 800; }
.np-title .count { font-size: 12px; color: var(--muted); font-weight: 600; }
.np-title .x { margin-left: auto; height: 30px; min-width: 30px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
.np-filter { display: flex; gap: 4px; margin-top: 12px; background: var(--code-bg); border-radius: 9px; padding: 3px; }
.np-filter button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 12px var(--f-display); padding: 6px 0; border-radius: 7px; cursor: pointer; }
.np-filter button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.np-list { flex: 1; overflow-y: auto; padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 10px; }
.np-empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
.np-empty svg { width: 34px; height: 34px; stroke-width: 1.5; color: var(--line); display: block; margin: 0 auto 10px; }
.np-foot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.np-foot i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.np-foot.synced i { background: var(--life); }

.ncard {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px 9px 15px;
  transition: border-color .15s, box-shadow .15s; overflow: hidden;
}
.ncard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--an-yellow-s)); }
.ncard:hover, .ncard.hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ncard.active { border-color: var(--accent); box-shadow: var(--shadow); }
.ncard.orphan { opacity: .75; }
.nq { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; font: italic 400 13.5px/1.45 var(--f-body); color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.nq:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.nt { margin: 7px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.nt.empty { color: var(--muted); font-size: 12.5px; font-style: italic; }
.nmeta { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.nmeta .sec { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.nmeta .acts { margin-left: auto; display: flex; gap: 2px; flex: none; }
.nmeta .acts button { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; border-radius: 6px; cursor: pointer; font: 600 11.5px var(--f-display); display: inline-flex; align-items: center; gap: 4px; }
.nmeta .acts button:hover { background: var(--code-bg); color: var(--ink); }
.nmeta .acts button.danger { color: var(--warn); }
.nmeta .acts svg { width: 14px; height: 14px; }
.orph { font-size: 11.5px; color: var(--warn); margin-top: 6px; }
.composer { margin-top: 8px; }
.composer textarea {
  width: 100%; min-height: 76px; resize: vertical; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-display);
}
.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.composer .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.composer .row .sw { width: 20px; height: 20px; }
.composer .row .gap { flex: 1; }
.btn { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 12.5px var(--f-display); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.composer .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font: 600 13px var(--f-display); box-shadow: var(--shadow-lg); }
.toast[hidden] { display: none; }
.scrim { position: fixed; inset: var(--top) 0 0 0; z-index: 30; background: rgba(8,10,16,.42); }
.scrim[hidden] { display: none; }

/* ---------- Điện thoại: mục lục là ngăn kéo trái, ghi chú là ngăn kéo nửa dưới (vẫn đọc được bài phía trên) ---------- */
@media (max-width: 759px) {
  .app, .app.side-on, .app.notes-on, .app.side-on.notes-on { grid-template-columns: minmax(0, 1fr); }
  .app.side-on .side {
    position: fixed; top: var(--top); left: 0; bottom: 0; height: auto; width: min(320px, 88vw); z-index: 35;
    background: var(--bg); box-shadow: var(--shadow-lg);
  }
  .app.notes-on .notes {
    position: fixed; top: auto; left: 0; right: 0; bottom: 0; height: 50vh; height: 50dvh; z-index: 34;
    background: var(--bg); border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg);
  }
  .app.notes-on .np-head { padding-top: 12px; }
  .app.notes-on main { padding-bottom: 54vh; }
  main { padding-inline: 16px; padding-block: 24px 96px; }
  body { font-size: 17px; }
  .reader h2 { font-size: 23px; }
  .topbar { padding: 0 12px; gap: 8px; }
  .lec-pick > button { padding: 0 8px 0 10px; }
  .lec-nav { grid-template-columns: 1fr; }
  .lec-nav a.next { grid-column: 1; }
}
@media (max-width: 560px) {
  .brand { display: none; }
  #notesBtn .lbl { display: none; }
}

/* ---------- Lightbox ---------- */
.lightbox[hidden] { display: none; }
.lightbox {
  position: fixed; inset: 0; z-index: 80; background: rgba(8,10,16,.88);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.lightbox img { max-width: min(1400px, 100%); max-height: calc(100% - 60px); border-radius: 8px; background: #fff; }
.lightbox .lb-bar { display: flex; gap: 10px; align-items: center; color: #E6E8F0; font: 600 14px var(--f-display); }
.lightbox button { font: 600 14px var(--f-display); padding: 7px 14px; border-radius: 8px; border: 1px solid #3A4052; background: #1B1F2B; color: #E6E8F0; cursor: pointer; }

.loading, .error { font-family: var(--f-display); color: var(--muted); padding: 40px 0; }

<script>
(function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICON = {
    sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    auto: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
    chev: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    edit: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
    bubble: '<svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  };
  const COLORS = ['yellow', 'green', 'blue', 'pink'];
  const toastEl = $('toast'); let toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 2600); }

  /* ---------- Theme (góc phải trên) ---------- */
  const themeBtn = $('themeBtn');
  const THEME = { system: ['Auto', ICON.auto, 'light'], light: ['Light', ICON.sun, 'dark'], dark: ['Dark', ICON.moon, 'system'] };
  function applyTheme(t) {
    if (!THEME[t]) t = 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    themeBtn.innerHTML = THEME[t][1];
    themeBtn.title = `Theme: ${THEME[t][0]} (click to switch)`;
    themeBtn.setAttribute('aria-label', `Theme: ${THEME[t][0]}. Switch to ${THEME[THEME[t][2]][0]}`);
    themeBtn.dataset.t = t;
  }
  applyTheme(store.get('cs336:theme') || 'system');
  themeBtn.addEventListener('click', () => { const n = THEME[themeBtn.dataset.t][2]; store.set('cs336:theme', n); applyTheme(n); });

  /* ---------- Hai cột bên: mục lục (trái) & ghi chú (phải) ----------
     Cả hai là cột nằm cạnh bài đọc, bật/tắt độc lập. Màn hình hẹp hơn 1100px
     thì chỉ mở một cột mỗi lúc. Điện thoại: mục lục là ngăn kéo, ghi chú là nửa dưới. */
  const app = $('app'), side = $('side'), scrim = $('scrim'), tocBtn = $('tocBtn'), notesBtn = $('notesBtn');
  const phone = () => matchMedia('(max-width: 759px)').matches;
  const narrow = phone;
  const roomy = () => innerWidth >= 1100;
  let sideOn = false, notesOn = false;
  function syncPanels() {
    app.classList.toggle('side-on', sideOn); app.classList.toggle('notes-on', notesOn);
    tocBtn.setAttribute('aria-pressed', String(sideOn));
    notesBtn.setAttribute('aria-pressed', String(notesOn));
    scrim.hidden = !(phone() && sideOn);
  }
  function remember() { if (!phone()) { store.set('cs336:side', sideOn ? 'on' : 'off'); store.set('cs336:notesPanel', notesOn ? 'on' : 'off'); } }
  function setSide(on) { sideOn = on; if (on && !roomy()) notesOn = false; remember(); syncPanels(); }
  function setNotes(on) { notesOn = on; if (on && !roomy()) sideOn = false; remember(); syncPanels(); }
  const showNotes = () => { if (!notesOn) setNotes(true); };
  function initPanels() {
    if (phone()) { sideOn = false; notesOn = false; }
    else {
      const sp = store.get('cs336:side'), np = store.get('cs336:notesPanel');
      sideOn = sp ? sp === 'on' : innerWidth >= 900;
      notesOn = np ? np === 'on' : innerWidth >= 1280;
      if (sideOn && notesOn && !roomy()) sideOn = false;
    }
    syncPanels();
  }
  initPanels();
  let wasPhone = phone(), rzT;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      if (phone() !== wasPhone) { wasPhone = phone(); initPanels(); }
      else if (!phone() && sideOn && notesOn && !roomy()) { sideOn = false; syncPanels(); }
    }, 150);
  });
  notesBtn.addEventListener('click', () => setNotes(!notesOn));
  tocBtn.addEventListener('click', () => setSide(!sideOn));
  $('npClose').addEventListener('click', () => setNotes(false));
  $('sideClose').addEventListener('click', () => setSide(false));
  scrim.addEventListener('click', () => setSide(false));

  /* ---------- Danh sách lecture ---------- */
  const reader = $('reader'), tocEl = $('toc'), lecBtn = $('lecBtn'), lecMenu = $('lecMenu');
  let lectures = [], current = null, ready = false, sections = [];

  function setMenu(open) { lecMenu.hidden = !open; lecBtn.setAttribute('aria-expanded', String(open)); }
  lecBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(lecMenu.hidden); });
  document.addEventListener('click', e => { if (!lecMenu.hidden && !e.target.closest('.lec-pick')) setMenu(false); });
  lecMenu.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });

  fetch('lectures.json').then(r => r.json()).then(data => {
    lectures = data.lectures.slice().sort((a, b) => a.num - b.num);
    route();
  }).catch(() => { reader.innerHTML = '<p class="error">Couldn\'t load the lecture list. Please reload the page.</p>'; });

  function doneCount(lec) {
    let n = 0;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(`cs336:${lec.id}:done:`) && localStorage.getItem(k) === '1') n++; } } catch (e) {}
    return n;
  }
  function renderMenu() {
    lecMenu.innerHTML = lectures.map(l => {
      const d = doneCount(l);
      return `<a href="#${l.id}" ${current && current.id === l.id ? 'aria-current="page"' : ''}>
        <span class="lm-num">${String(l.num).padStart(2, '0')}</span>
        <span><span class="lm-title">${esc(l.titleVi)}</span><span class="lm-meta">${esc(l.title)} · ${l.slides} slides${d ? ` · ${d} understood` : ''}</span></span></a>`;
    }).join('') + '<div class="lm-foot">New lectures show up here as they are added.</div>';
  }

  window.addEventListener('hashchange', route);
  function route() {
    if (!lectures.length) return;
    const h = decodeURIComponent(location.hash.slice(1));
    const lec = lectures.find(l => h === l.id || h.startsWith(l.id + '-')) || lectures[lectures.length - 1];
    if (current && current.id === lec.id) {
      const t = h && document.getElementById(h);
      if (t) t.scrollIntoView();
      if (narrow()) setSide(false);
      return;
    }
    openLecture(lec, h);
  }

  function openLecture(lec, anchor) {
    current = lec; ready = false;
    renderMenu();
    $('lecBtnNum').textContent = `L${lec.num}`;
    $('lecBtnTitle').textContent = lec.titleVi;
    $('sideKicker').textContent = `Lecture ${lec.num} · ${lec.slides} slides`;
    $('sideTitle').textContent = lec.titleVi;
    document.title = `L${lec.num} · CS336 Notebook`;
    reader.innerHTML = '<p class="loading">Loading lecture…</p>';
    tocEl.innerHTML = '';
    activeId = null; editingId = null; draft = null;
    renderPanel();
    fetch(lec.file).then(r => r.text()).then(html => {
      if (current !== lec) return;
      reader.innerHTML = html;
      reader.querySelectorAll('.mtoc').forEach(e => e.remove());
      runScripts(reader);
      expandSlides(reader, lec);
      buildSections(reader, lec);
      appendLecNav(lec);
      if (anchor && anchor !== lec.id) { const t = document.getElementById(anchor); if (t) t.scrollIntoView(); }
      else window.scrollTo(0, 0);
      typeset(reader).then(() => {
        if (current !== lec) return;
        ready = true; applyAnnos(); renderPanel();
        if (anchor && anchor !== lec.id) { const t = document.getElementById(anchor); if (t) t.scrollIntoView(); }
      });
    }).catch(e => { console.error(e); reader.innerHTML = '<p class="error">Couldn\'t load this lecture. Please reload the page.</p>'; });
  }

  function runScripts(root) {
    root.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }

  // <div class="slides" data-s="2,3"> → ảnh slide bấm để phóng to
  function expandSlides(root, lec) {
    root.querySelectorAll('.slides[data-s]').forEach(box => {
      const nums = box.dataset.s.split(',').map(s => parseInt(s, 10));
      if (nums.length === 1) box.classList.add('one');
      box.innerHTML = nums.map(n => {
        const src = `${lec.imgDir}/s-${String(n).padStart(2, '0')}.jpg`;
        return `<button class="sl" data-n="${n}" aria-label="Enlarge slide ${n}"><img src="${src}" alt="Slide ${n} of lecture ${lec.num}" loading="lazy"><span>Slide ${n}</span></button>`;
      }).join('');
    });
    root.querySelectorAll('.sl').forEach(b => b.addEventListener('click', () => openLb(parseInt(b.dataset.n, 10))));
  }

  function appendLecNav(lec) {
    const i = lectures.indexOf(lec), prev = lectures[i - 1], next = lectures[i + 1];
    if (!prev && !next) return;
    const nav = document.createElement('nav');
    nav.className = 'lec-nav'; nav.setAttribute('aria-label', 'Other lectures');
    nav.innerHTML = (prev ? `<a href="#${prev.id}"><small>← Previous · Lecture ${prev.num}</small><b>${esc(prev.titleVi)}</b></a>` : '') +
      (next ? `<a class="next" href="#${next.id}"><small>Next · Lecture ${next.num} →</small><b>${esc(next.titleVi)}</b></a>` : '');
    reader.appendChild(nav);
  }

  /* ---------- Mục lục phân cấp + "đã hiểu" ---------- */
  let tocObserver = null;
  function buildSections(root, lec) {
    const label = h => h.dataset.short || h.firstElementChild?.textContent || h.textContent;
    const groups = []; let grp = { part: null, items: [] }; groups.push(grp); let lastItem = null;
    root.querySelectorAll('h2[id], .part[id], h3').forEach(h => {
      if (h.classList.contains('part')) { grp = { part: h, items: [] }; groups.push(grp); lastItem = null; }
      else if (h.tagName === 'H2') { lastItem = { h, subs: [] }; grp.items.push(lastItem); }
      else if (lastItem) { if (!h.id) h.id = `${lastItem.h.id}-s${lastItem.subs.length + 1}`; lastItem.subs.push(h); }
    });
    sections = groups.flatMap(g => g.items.map(it => it.h));
    const key = id => `cs336:${lec.id}:done:${id}`;
    const isDone = id => store.get(key(id)) === '1';

    sections.forEach(h => {
      const b = document.createElement('button');
      b.className = 'done-btn';
      const set = v => { b.setAttribute('aria-pressed', String(v)); b.textContent = v ? '✓ Understood' : 'Mark as understood'; };
      set(isDone(h.id));
      b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; store.set(key(h.id), v ? '1' : '0'); set(v); refresh(); renderMenu(); });
      h.appendChild(b);
    });

    const itemHtml = it => `<li data-for="${it.h.id}"><a href="#${it.h.id}"><span class="tick"></span><span>${esc(label(it.h))}</span></a>` +
      (it.subs.length ? `<ol class="toc-sub">${it.subs.map(s => `<li data-for="${s.id}"><a href="#${s.id}"><span class="tick"></span><span>${esc(s.textContent)}</span></a></li>`).join('')}</ol>` : '') + '</li>';
    const collapsed = JSON.parse(store.get(`cs336:${lec.id}:collapsed`) || '[]');
    tocEl.innerHTML = groups.map(g => {
      if (!g.part) return g.items.map(itemHtml).join('');
      const open = !collapsed.includes(g.part.id);
      return `<li class="toc-part" data-part="${g.part.id}"><button aria-expanded="${open}">${ICON.chev}<span>${esc(label(g.part))}</span><span class="cnt" data-cnt="${g.part.id}"></span></button><ol>${g.items.map(itemHtml).join('')}</ol></li>`;
    }).join('');
    tocEl.querySelectorAll('.toc-part > button').forEach(b => b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', String(open));
      const id = b.parentElement.dataset.part, list = JSON.parse(store.get(`cs336:${lec.id}:collapsed`) || '[]').filter(x => x !== id);
      if (!open) list.push(id);
      store.set(`cs336:${lec.id}:collapsed`, JSON.stringify(list));
    }));
    tocEl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { if (narrow()) setSide(false); }));

    function refresh() {
      const done = sections.filter(h => isDone(h.id)).length;
      tocEl.querySelectorAll('li[data-for]').forEach(li => { const t = li.querySelector(':scope > a .tick'); if (t) t.textContent = isDone(li.dataset.for) ? '✓' : ''; });
      groups.forEach(g => { if (g.part) { const c = tocEl.querySelector(`[data-cnt="${g.part.id}"]`); if (c) c.textContent = `${g.items.filter(it => isDone(it.h.id)).length}/${g.items.length}`; } });
      const pct = sections.length ? done / sections.length * 100 : 0, txt = `Understood ${done}/${sections.length} sections`;
      $('sideBar').style.width = pct + '%'; $('sideProg').textContent = txt;
      const bar = root.querySelector('.progress');
      if (bar) { bar.querySelector('i').style.width = pct + '%'; bar.querySelector('span').textContent = txt; }
    }
    refresh();

    if (tocObserver) tocObserver.disconnect();
    if ('IntersectionObserver' in window) {
      const subs = groups.flatMap(g => g.items.flatMap(it => it.subs));
      tocObserver = new IntersectionObserver(es => {
        es.forEach(e => {
          if (!e.isIntersecting) return;
          const id = e.target.id;
          if (e.target.tagName === 'H2') {
            tocEl.querySelectorAll('li[data-for]').forEach(li => li.classList.remove('active', 'on'));
            const li = tocEl.querySelector(`li[data-for="${id}"]`);
            if (li) {
              li.classList.add('active');
              const part = li.closest('.toc-part');
              if (part) part.querySelector(':scope > button').setAttribute('aria-expanded', 'true');
              if (!narrow()) { const r = li.getBoundingClientRect(), sr = side.getBoundingClientRect(); if (r.top < sr.top + 90 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - sr.height / 3; }
            }
          } else {
            tocEl.querySelectorAll('.toc-sub li').forEach(li => li.classList.toggle('on', li.dataset.for === id));
          }
        });
      }, { rootMargin: '-60px 0px -70% 0px' });
      sections.forEach(h => tocObserver.observe(h));
      subs.forEach(h => tocObserver.observe(h));
    }
  }

  function typeset(root) {
    return new Promise(resolve => {
      let tries = 0;
      (function go() {
        const mj = window.MathJax;
        if (mj && typeof mj.typesetPromise === 'function') {
          const p = mj.startup && mj.startup.promise ? mj.startup.promise : Promise.resolve();
          p.then(() => mj.typesetPromise([root])).catch(() => {}).then(resolve);
        } else if (window.__mjFailed || tries++ > 40) resolve();
        else setTimeout(go, 250);
      })();
    });
  }

  /* =================================================================
     Ghi chú & đánh dấu
     Mỗi ghi chú neo vào bài bằng đoạn trích (quote) + vài chữ trước/sau,
     nên vẫn tìm lại được khi trang tải lại. Lưu vào kho riêng của từng
     người (db: data/users/<id>/…) nếu có, nếu không thì lưu ở trình duyệt.
     ================================================================= */
  let notes = new Map(), draft = null, editingId = null, activeId = null, filter = 'all', positions = {};
  let backend = 'local', coll = null, unsub = null;
  const LOCAL_KEY = 'cs336:notes';

  function loadLocal() {
    try { const o = JSON.parse(store.get(LOCAL_KEY) || '{}'); notes = new Map(Object.entries(o)); } catch (e) { notes = new Map(); }
  }
  function writeLocal() { store.set(LOCAL_KEY, JSON.stringify(Object.fromEntries(notes))); }
  loadLocal();

  (async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') return renderFoot();
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return renderFoot();
      const uid = await user.id();
      if (!uid) return renderFoot();
      coll = db.collection('data/users/' + uid);
      const pending = [...notes.values()];
      unsub = coll.where('kind', '==', 'note').onSnapshot(snap => {
        backend = 'db';
        const m = new Map(snap.docs.map(d => [d.id, d.data()]));
        pending.forEach(n => { if (!m.has(n.id)) m.set(n.id, n); });
        notes = m;
        onNotesChanged();
      }, err => { console.warn('notes sync stopped', err && err.code); toLocal(); });
      for (const n of pending) { await coll.doc(n.id).set(n); }
      if (pending.length) { store.del(LOCAL_KEY); pending.length = 0; }
    } catch (e) { console.warn('notes sync unavailable', e && e.code); toLocal(); }
  })();

  function toLocal() {
    if (backend === 'local' && !unsub) return renderFoot();
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    backend = 'local'; coll = null;
    const keep = notes; loadLocal(); keep.forEach((n, id) => notes.set(id, n)); writeLocal();
    onNotesChanged();
  }
  async function saveNote(n) {
    n = { ...n, updated: Date.now() };
    notes.set(n.id, n); onNotesChanged();
    if (backend === 'db' && coll) {
      try { await coll.doc(n.id).set(JSON.parse(JSON.stringify(n))); return; }
      catch (e) { console.warn(e); toast('Couldn\'t sync. Saved in this browser instead.'); toLocal(); return; }
    }
    writeLocal();
  }
  async function deleteNote(id) {
    notes.delete(id); if (activeId === id) activeId = null; onNotesChanged();
    if (backend === 'db' && coll) { try { await coll.doc(id).delete(); return; } catch (e) { console.warn(e); toLocal(); return; } }
    writeLocal();
  }
  function renderFoot() {
    const f = $('npFoot');
    f.classList.toggle('synced', backend === 'db');
    f.querySelector('span').textContent = backend === 'db' ? 'Synced to your account (private to you)' : 'Saved in this browser only';
  }
  function lecNotes() {
    if (!current) return [];
    const list = [...notes.values()].filter(n => n.lec === current.id);
    if (draft) list.push(draft);
    return list;
  }
  function onNotesChanged() { if (ready) applyAnnos(); renderPanel(); }

  /* ----- Chỉ mục văn bản của bài đọc ----- */
  const SKIP = 'script,style,mjx-container,svg,.done-btn,.widget,.lec-nav,.slides';
  function buildIndex() {
    const segs = []; let text = '';
    const w = document.createTreeWalker(reader, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement && n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    for (let n = w.nextNode(); n; n = w.nextNode()) { segs.push({ node: n, start: text.length, end: text.length + n.data.length }); text += n.data; }
    return { text, segs };
  }
  function boundaryOffset(idx, container, offset, isEnd) {
    if (container.nodeType === 3) { const s = idx.segs.find(x => x.node === container); if (s) return s.start + offset; }
    const r = document.createRange(); r.setStart(container, offset); r.collapse(true);
    if (!isEnd) { for (const s of idx.segs) if (r.comparePoint(s.node, 0) >= 0) return s.start; return idx.text.length; }
    let pos = 0; for (const s of idx.segs) { if (r.comparePoint(s.node, s.node.data.length) <= 0) pos = s.end; else break; } return pos;
  }
  function locate(text, n) {
    let best = null, bestScore = -Infinity, i = text.indexOf(n.quote);
    while (i !== -1) {
      let sc = 0;
      const pre = n.prefix || '', suf = n.suffix || '';
      for (let k = 1; k <= pre.length && i - k >= 0 && text[i - k] === pre[pre.length - k]; k++) sc++;
      const e = i + n.quote.length;
      for (let k = 0; k < suf.length && text[e + k] === suf[k]; k++) sc++;
      sc -= Math.abs(i - (n.start || 0)) / 1e7;
      if (sc > bestScore) { bestScore = sc; best = i; }
      i = text.indexOf(n.quote, i + 1);
    }
    return best === null ? null : { s: best, e: best + n.quote.length };
  }
  function unwrapAll() {
    const parents = new Set();
    reader.querySelectorAll('.anno').forEach(sp => { const p = sp.parentNode; while (sp.firstChild) p.insertBefore(sp.firstChild, sp); p.removeChild(sp); parents.add(p); });
    parents.forEach(p => { if (p.isConnected) p.normalize(); });
  }
  function wrap(s, e, n) {
    const { segs } = buildIndex();
    const pieces = [];
    for (const seg of segs) {
      if (seg.end <= s || seg.start >= e) continue;
      const a = Math.max(s, seg.start) - seg.start, b = Math.min(e, seg.end) - seg.start;
      if (!seg.node.data.slice(a, b).trim()) continue;
      pieces.push({ node: seg.node, a, b });
    }
    for (const p of pieces) {
      let node = p.node;
      if (p.b < node.data.length) node.splitText(p.b);
      if (p.a > 0) node = node.splitText(p.a);
      const sp = document.createElement('span');
      sp.className = `anno c-${COLORS.includes(n.color) ? n.color : 'yellow'}${n.text ? ' has-note' : ''}${n.id === activeId ? ' lit' : ''}`;
      sp.dataset.nid = n.id;
      node.parentNode.insertBefore(sp, node); sp.appendChild(node);
    }
  }
  function applyAnnos() {
    unwrapAll();
    positions = {};
    const { text } = buildIndex();
    const found = [];
    lecNotes().forEach(n => { const r = n.quote && locate(text, n); if (r) { positions[n.id] = r.s; found.push([r, n]); } });
    found.forEach(([r, n]) => wrap(r.s, r.e, n));
  }

  /* ----- Thanh công cụ khi bôi đen ----- */
  const pop = $('selPop');
  const coarse = matchMedia('(pointer: coarse)');
  let pointerDown = false, selT;
  function selRange() {
    const sel = getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed || !ready) return null;
    const r = sel.getRangeAt(0);
    if (!reader.contains(r.commonAncestorContainer)) return null;
    const bad = n => { const el = n.nodeType === 1 ? n : n.parentElement; return el && el.closest('.widget, .done-btn, .lec-nav, input, textarea, select, button'); };
    if (bad(r.startContainer) || bad(r.endContainer)) return null;
    if (!r.toString().trim()) return null;
    return r;
  }
  function hidePop() { pop.hidden = true; }
  function placePop(r) {
    pop.classList.toggle('touch', coarse.matches);
    pop.hidden = false;
    if (coarse.matches) return;
    const rect = r.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    let top = rect.top - h - 8;
    if (top < 64) top = rect.bottom + 8;
    pop.style.top = top + 'px';
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, rect.left + rect.width / 2 - w / 2)) + 'px';
  }
  function checkSel() { const r = selRange(); if (r) placePop(r); else hidePop(); }
  document.addEventListener('pointerdown', e => { if (!pop.contains(e.target)) { pointerDown = true; hidePop(); } });
  document.addEventListener('pointerup', () => { if (!pointerDown) return; pointerDown = false; setTimeout(checkSel, 10); });
  document.addEventListener('selectionchange', () => { if (pointerDown) return; clearTimeout(selT); selT = setTimeout(checkSel, coarse.matches ? 350 : 120); });
  window.addEventListener('scroll', () => { if (!pop.hidden && !coarse.matches) { const r = selRange(); if (r) placePop(r); else hidePop(); } }, { passive: true });
  pop.addEventListener('pointerdown', e => e.preventDefault());
  pop.addEventListener('mousedown', e => e.preventDefault());
  pop.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => createFromSelection(b.dataset.c, false)));
  $('selNote').addEventListener('click', () => createFromSelection(store.get('cs336:lastColor') || 'yellow', true));

  function createFromSelection(color, withNote) {
    const r = selRange(); if (!r) return hidePop();
    const idx = buildIndex();
    let s = boundaryOffset(idx, r.startContainer, r.startOffset, false), e = boundaryOffset(idx, r.endContainer, r.endOffset, true);
    while (s < e && /\s/.test(idx.text[s])) s++;
    while (e > s && /\s/.test(idx.text[e - 1])) e--;
    if (e <= s) { hidePop(); return; }
    if (e - s > 4000) { toast('That selection is too long. Try a shorter passage.'); return; }
    let sec = '';
    sections.forEach(h => { if (r.comparePoint(h, 0) <= 0) sec = h.id; });
    const now = Date.now();
    const n = {
      id: 'n' + now.toString(36) + Math.random().toString(36).slice(2, 7), kind: 'note', lec: current.id, sec,
      quote: idx.text.slice(s, e), prefix: idx.text.slice(Math.max(0, s - 40), s), suffix: idx.text.slice(e, e + 40),
      start: s, color, text: '', created: now, updated: now,
      display: r.toString().replace(/\s+/g, ' ').trim().slice(0, 600)
    };
    store.set('cs336:lastColor', color);
    getSelection().removeAllRanges(); hidePop();
    if (withNote) { draft = n; editingId = n.id; activeId = n.id; showNotes(); onNotesChanged(); focusComposer(); }
    else { activeId = n.id; saveNote(n); toast('Highlighted. Click it to add a note.'); }
  }

  /* ----- Bảng ghi chú ----- */
  const list = $('npList');
  let editText = '', editColor = 'yellow', delArm = null;
  const fmtDate = t => { const d = new Date(t), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  function secName(id) { const h = id && document.getElementById(id); return h ? (h.dataset.short || h.firstElementChild?.textContent || '') : ''; }

  function renderPanel() {
    renderFoot();
    const all = lecNotes();
    const nNotes = all.filter(n => n.text || n === draft).length;
    $('npCount').textContent = all.length ? `${all.length} in this lecture` : '';
    $('notesBadge').textContent = all.length ? String(all.length) : '';
    $('notesBtn').setAttribute('aria-label', `Notes, ${all.length} in this lecture`);
    document.querySelectorAll('.np-filter button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.f === filter));
      const c = b.dataset.f === 'all' ? all.length : b.dataset.f === 'note' ? nNotes : all.length - nNotes;
      b.textContent = `${{ all: 'All', note: 'Notes', hl: 'Highlights' }[b.dataset.f]}${c ? ' ' + c : ''}`;
    });
    const shown = all.filter(n => filter === 'all' || (filter === 'note' ? (n.text || n === draft) : !(n.text || n === draft)))
      .sort((a, b) => (positions[a.id] ?? Infinity) - (positions[b.id] ?? Infinity) || a.created - b.created);
    if (!shown.length) {
      list.innerHTML = `<div class="np-empty">${ICON.bubble}${all.length ? 'Nothing here for this filter.' : current ? 'No notes yet.<br>Select any text in the lecture to highlight it or add a note.' : ''}</div>`;
      return;
    }
    list.innerHTML = shown.map(n => {
      const editing = n.id === editingId, orphan = ready && positions[n.id] === undefined;
      const body = editing
        ? `<div class="composer"><textarea aria-label="Note text" placeholder="Write a note…"></textarea>
            <div class="row">${COLORS.map(c => `<button class="sw c-${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="false"></button>`).join('')}<span class="gap"></span>
            <button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button></div>
            <div class="hint">Ctrl/⌘ + Enter to save · Esc to cancel</div></div>`
        : (n.text ? `<p class="nt">${esc(n.text)}</p>` : `<p class="nt empty">Highlight only</p>`);
      const acts = editing ? '' : `<span class="acts"><button data-act="edit" aria-label="${n.text ? 'Edit note' : 'Add note'}">${ICON.edit}${n.text ? '' : 'Add note'}</button><button data-act="del" class="${delArm === n.id ? 'danger' : ''}" aria-label="Delete">${ICON.trash}${delArm === n.id ? 'Delete?' : ''}</button></span>`;
      return `<article class="ncard${n.id === activeId ? ' active' : ''}${orphan ? ' orphan' : ''}" data-nid="${n.id}" style="--c: var(--an-${COLORS.includes(n.color) ? n.color : 'yellow'}-s)">
        <button class="nq" data-act="go" title="Go to this passage">“${esc((n.display || n.quote).replace(/\s+/g, ' '))}”</button>
        ${orphan ? '<div class="orph">Couldn\'t find this passage in the lecture anymore.</div>' : ''}
        ${body}
        <div class="nmeta"><span class="sec">${esc(secName(n.sec))}${secName(n.sec) ? ' · ' : ''}${fmtDate(n.updated || n.created)}</span>${acts}</div></article>`;
    }).join('');
    const ed = editingId && list.querySelector(`.ncard[data-nid="${editingId}"] textarea`);
    if (ed) {
      ed.value = editText;
      list.querySelectorAll(`.ncard[data-nid="${editingId}"] .sw`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === editColor)));
    }
  }
  function focusComposer() {
    const ed = list.querySelector(`.ncard[data-nid="${editingId}"] textarea`);
    if (ed) { ed.focus({ preventScroll: true }); ed.setSelectionRange(ed.value.length, ed.value.length); ed.closest('.ncard').scrollIntoView({ block: 'nearest' }); }
  }
  function startEdit(id) {
    const n = notes.get(id) || (draft && draft.id === id ? draft : null); if (!n) return;
    editingId = id; editText = n.text || ''; editColor = n.color || 'yellow'; activeId = id; delArm = null;
    renderPanel(); litAnno(); focusComposer();
  }
  function finishEdit(save) {
    const id = editingId; if (!id) return;
    const ed = list.querySelector(`.ncard[data-nid="${id}"] textarea`); if (ed) editText = ed.value;
    editingId = null;
    if (draft && draft.id === id) {
      const d = draft; draft = null;
      if (save) saveNote({ ...d, text: editText.trim(), color: editColor }); else onNotesChanged();
    } else if (save) {
      const n = notes.get(id); if (n) saveNote({ ...n, text: editText.trim(), color: editColor });
    } else renderPanel();
    editText = '';
  }
  function setActive(id, scrollCard) {
    activeId = id; renderPanel(); litAnno();
    if (scrollCard) { const c = list.querySelector(`.ncard[data-nid="${id}"]`); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  function litAnno() { reader.querySelectorAll('.anno').forEach(sp => sp.classList.toggle('lit', sp.dataset.nid === activeId)); }
  function goTo(id) {
    const spans = [...reader.querySelectorAll(`.anno[data-nid="${id}"]`)];
    setActive(id, false);
    if (!spans.length) { toast('Couldn\'t find this passage in the lecture.'); return; }
    if (phone() && sideOn) setSide(false);
    for (let d = spans[0].closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
    const y = spans[0].getBoundingClientRect().top + window.scrollY - (phone() ? 96 : Math.round(innerHeight * 0.3));
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    spans.forEach(sp => { sp.classList.remove('flash'); void sp.offsetWidth; sp.classList.add('flash'); });
    setTimeout(() => spans.forEach(sp => sp.classList.remove('flash')), 1700);
  }

  list.addEventListener('click', e => {
    const card = e.target.closest('.ncard'); if (!card) return;
    const id = card.dataset.nid, act = e.target.closest('[data-act]')?.dataset.act;
    const sw = e.target.closest('.composer .sw');
    if (sw) { editColor = sw.dataset.c; card.querySelectorAll('.composer .sw').forEach(b => b.setAttribute('aria-pressed', String(b === sw))); card.style.setProperty('--c', `var(--an-${editColor}-s)`); return; }
    if (act === 'go') return goTo(id);
    if (act === 'edit') return startEdit(id);
    if (act === 'save') return finishEdit(true);
    if (act === 'cancel') return finishEdit(false);
    if (act === 'del') {
      if (delArm === id) { delArm = null; deleteNote(id); return; }
      delArm = id; renderPanel(); setTimeout(() => { if (delArm === id) { delArm = null; renderPanel(); } }, 3000); return;
    }
    if (!e.target.closest('textarea, button, .composer')) goTo(id);
  });
  list.addEventListener('input', e => { if (e.target.matches('textarea')) editText = e.target.value; });
  list.addEventListener('keydown', e => {
    if (!e.target.matches('textarea')) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); finishEdit(true); }
    if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
  });
  document.querySelectorAll('.np-filter button').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; renderPanel(); }));

  reader.addEventListener('click', e => {
    const sp = e.target.closest('.anno'); if (!sp) return;
    const sel = getSelection(); if (sel && !sel.isCollapsed) return;
    showNotes(); setActive(sp.dataset.nid, true);
  });
  reader.addEventListener('mouseover', e => {
    const sp = e.target.closest('.anno');
    list.querySelectorAll('.ncard.hover').forEach(c => c.classList.remove('hover'));
    if (sp) { const c = list.querySelector(`.ncard[data-nid="${sp.dataset.nid}"]`); if (c) c.classList.add('hover'); }
  });

  /* ---------- Lightbox ---------- */
  const lb = $('lightbox'), lbImg = $('lbImg'), lbCap = $('lbCap');
  let lbN = 1;
  function openLb(n) {
    lbN = Math.max(1, Math.min(current.slides, n));
    lbImg.src = `${current.imgDir}/s-${String(lbN).padStart(2, '0')}.jpg`;
    lbImg.alt = `Slide ${lbN}`;
    lbCap.textContent = `Slide ${lbN} / ${current.slides}`;
    lb.hidden = false;
  }
  $('lbPrev').onclick = () => openLb(lbN - 1);
  $('lbNext').onclick = () => openLb(lbN + 1);
  $('lbClose').onclick = () => { lb.hidden = true; };
  lb.addEventListener('click', e => { if (e.target === lb) lb.hidden = true; });
  document.addEventListener('keydown', e => {
    if (!lb.hidden) {
      if (e.key === 'Escape') lb.hidden = true;
      if (e.key === 'ArrowLeft') openLb(lbN - 1);
      if (e.key === 'ArrowRight') openLb(lbN + 1);
      return;
    }
    if (e.key === 'Escape') { hidePop(); setMenu(false); if (phone() && sideOn) setSide(false); }
  });
})();
</script>
