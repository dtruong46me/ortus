[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytorch"
version = "0.3.0"
description = "Framework deep learning nhỏ tự xây từ đầu (học theo khóa TinyTorch)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["tinytorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
